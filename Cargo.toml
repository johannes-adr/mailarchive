[package]
name = "mailarchive"
version = "0.1.0"
edition = "2021"
description = "Tiny incremental, IDLE-driven IMAP -> Maildir sync (like mbsync)"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
imap = "3.0.0-alpha.15"
imap-proto = "0.16"
native-tls = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
strip = true
lto = true
codegen-units = 1
